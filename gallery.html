<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery | Sohal Electrical Works</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0d0d0d;
    color:white;
    padding:40px 8%;
}

h1{
    text-align:center;
    color:#ffcc00;
    margin-bottom:20px;
    font-size:3rem;
}

p{
    text-align:center;
    color:#bbb;
    margin-bottom:50px;
    line-height:1.8;
}

.gallery-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.gallery-grid img{
    width:100%;
    height:300px;
    object-fit:cover;
    border-radius:18px;
    transition:0.3s;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.gallery-grid img:hover{
    transform:scale(1.03);
}

.back-btn{
    display:inline-block;
    margin-bottom:40px;
    padding:14px 25px;
    background:#ffcc00;
    color:#000;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
}

.empty-message{
    text-align:center;
    color:#777;
    margin-top:60px;
    font-size:1.2rem;
}

@media(max-width:768px){

    body{
        padding:20px;
    }

    h1{
        font-size:2.3rem;
    }

}

</style>

</head>

<body>

<a href="index.html" class="back-btn">
← Back To Website
</a>

<h1>Our Full Gallery</h1>

<p>
All uploaded electrical products, fittings, wires,
switches, lighting products, and supply materials.
</p>

<div
class="gallery-grid"
id="galleryGrid"
>

</div>

<div
class="empty-message"
id="emptyMessage"
>

No gallery photos uploaded yet.

</div>

<script>

window.onload = function(){

    loadGallery();

};

function loadGallery(){

    const galleryGrid =
    document.getElementById('galleryGrid');

    const emptyMessage =
    document.getElementById('emptyMessage');

    galleryGrid.innerHTML = '';

    let images =
    JSON.parse(localStorage.getItem('galleryImages'))
    || [];

    if(images.length === 0){

        emptyMessage.style.display = 'block';

        return;

    }

    emptyMessage.style.display = 'none';

    images
    .slice()
    .reverse()
    .forEach(src=>{

        const img =
        document.createElement('img');

        img.src = src;

        galleryGrid.appendChild(img);

    });

}

</script>

</body>
</html>
